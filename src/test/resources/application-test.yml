spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

app:
  batch:
    enabled: false
    partition:
      chunk-size: ${IAR_BATCH_TEST_CHUNK_SIZE}
      source-table: ${IAR_BATCH_TEST_SOURCE_TABLE}
    
  comparison-test:
    output-directory: ${IAR_BATCH_TEST_OUTPUT_DIR}
    procedure-filename: ${IAR_BATCH_TEST_PROCEDURE_FILENAME}
    query-filename: ${IAR_BATCH_TEST_REQUETE_FILENAME}
    
  datasource:
    oracle-test:
      driver-class-name: oracle.jdbc.OracleDriver
      jdbc-url: jdbc:oracle:thin:@//${IAR_ORACLE_TEST_HOST}:${IAR_ORACLE_TEST_PORT}/${IAR_ORACLE_TEST_SERVICE}
      username: ${IAR_ORACLE_TEST_USER}
      password: ${IAR_ORACLE_TEST_PASSWORD}
