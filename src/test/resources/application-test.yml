server:
  port: 8081

spring:
  application:
    name: iar-batch-dump-test
  
  # H2 Database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    
  h2:
    console:
      enabled: false
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# Oracle DataSource for testing (mock or embedded)
datasource:
  oracle:
    url: jdbc:h2:mem:oracle_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

# Disable scheduled jobs during tests
app:
  batch:
    chunk-size: 10
    max-readers: 1
